version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lockedin
      POSTGRES_PASSWORD: lockedin
      POSTGRES_DB: lockedin
    ports:
      - "5432:5432"
    volumes:
      - lockedin_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: lockedin
      MINIO_ROOT_PASSWORD: lockedin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - lockedin_minio:/data

volumes:
  lockedin_pg:
  lockedin_minio:
